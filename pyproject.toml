[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamecam-vo"
version = "0.1.0"
description = "Evidence-gated game camera datasets and ORB essential-matrix baseline"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["gamecam_vo*", "datasets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
